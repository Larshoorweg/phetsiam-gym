<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phetsiam Muay Thai Gym Bangkok | Real Muay Thai for everyone</title>
<meta name="description" content="Muay Thai gym in Bangkok (Sathu Pradit 58). Group classes for all levels, private training and fight preparation with head coach Numsurin, ONE Championship contender. Trial class 550 THB.">
<meta name="theme-color" content="#161616">
<meta property="og:type" content="website">
<meta property="og:title" content="Phetsiam Muay Thai Gym Bangkok | Real Muay Thai for everyone">
<meta property="og:description" content="Muay Thai gym in Bangkok (Sathu Pradit 58). Group classes for all levels, private training and fight preparation with head coach Numsurin, ONE Championship contender. Trial class 550 THB.">
<meta property="og:image" content="assets/hero-team-tall.jpg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700;1,800&family=Inter:wght@400;500;600&family=Kanit:wght@400;500&display=swap">
<style>
html{scroll-behavior:smooth}
body{margin:0;background:#161616}
a{color:inherit}a:hover{color:inherit}
.root > *{flex-shrink:0}
.root{container-type:inline-size;--black:#161616;--char:#2A2A2A;--white:#F5F5F3;--steel:#C4C4C0;--mat:#8E8E8C;--gold:#F2C230;background:#161616;color:#F5F5F3;font-family:Inter,Kanit,system-ui,sans-serif;font-size:16px;line-height:1.55;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.root *{box-sizing:border-box}
.root section{scroll-margin-top:64px}
.root img{display:block;max-width:100%}
.root p{margin:0}
.root ul{margin:0;padding:0;list-style:none}
.h{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;line-height:.94;letter-spacing:0;margin:0;text-wrap:balance}
.th{font-family:Kanit,Inter,sans-serif;font-weight:400}
.eyebrow{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:15px;color:#C4C4C0}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 20px}
.sec{padding:35px 0}
.m-hide,.m-hide-li{display:none}
.light{background:#F5F5F3 repeating-linear-gradient(90deg,rgba(22,22,22,0) 0 22px,rgba(22,22,22,.045) 22px 24px);color:#161616}
.light .eyebrow{color:#5A5A58}
.dim{background:#1B1B1B repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.022) 22px 24px)}
.h2{font-size:46px}
.sub-th{font-size:17px;color:#8E8E8C;margin-top:8px}
.light .sub-th{color:#5A5A58}
.lede{font-size:16px;color:#C4C4C0;max-width:560px}
.light .lede{color:#3A3A39}

/* buttons: slanted like the red bar in the logo */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-style:italic;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;border:0;cursor:pointer;clip-path:polygon(11px 0,100% 0,calc(100% - 11px) 100%,0 100%);white-space:nowrap}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{color:#fff;filter:brightness(1.08)}
.btn-ghost{background:rgba(245,245,243,.14);color:#F5F5F3}
.btn-dark{background:#161616;color:#F5F5F3}
.btn-dark:hover{color:#F5F5F3}
.btn-line{background:rgba(22,22,22,.08);color:#161616}
.btn-off{opacity:.35;cursor:not-allowed}
.textlink{font-weight:600;text-underline-offset:4px}

/* header */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 16px;background:rgba(22,22,22,.93);backdrop-filter:blur(10px);border-bottom:1px solid #2A2A2A}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .mk{height:30px;width:auto}
.brand .wm{height:26px;width:auto}
.nav{display:none}
.hdr-cta{display:none}
.hdr-r{display:flex;align-items:center;gap:18px}
.lang{display:flex;border:1px solid #4A4A48}
.lang button{min-width:44px;min-height:40px;border:0;background:transparent;color:#C4C4C0;font:600 13px Inter,sans-serif;letter-spacing:.06em;cursor:pointer}
.lang button.on{background:#F5F5F3;color:#161616}

/* hero */
.hero{position:relative}
.hero-photo{position:relative;aspect-ratio:3/4;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,22,22,.25) 0,rgba(22,22,22,0) 22%,rgba(22,22,22,0) 48%,rgba(22,22,22,.86) 78%,#161616 100%)}
.hero-copy{position:relative;margin-top:-196px;padding:0 20px 36px;display:flex;flex-direction:column;gap:16px}
.pill{align-self:flex-start;max-width:100%;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;background:#F5F5F3;color:#161616;text-decoration:none;font-size:13px;font-weight:600;line-height:1.25;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.pill:hover{color:#161616}
.pill b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.h1{font-size:min(14cqw,72px)}
.hero-th{font-size:20px;color:#C4C4C0;margin-top:-6px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cta-row .btn{flex:1 1 auto}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:10px;border-top:1px solid #3A3A3A}
.facts li{padding:14px 10px 0 0}
.facts b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:23px;line-height:1;text-transform:uppercase}
.facts span{display:block;font-size:12px;color:#C4C4C0;margin-top:5px;line-height:1.3}

/* ring ropes */
.ropes{display:flex;flex-direction:column;gap:12px;padding:14px 0;overflow:hidden;background:#161616}
.rope{height:30px;overflow:hidden;background:linear-gradient(180deg,#fff 0,#F5F5F3 45%,#CFCFCA 100%);color:#161616}
.rope-track{display:flex;width:max-content;height:100%;animation:ph-slide 70s linear infinite}
.rope-b .rope-track{animation-direction:reverse;animation-duration:90s}
.rope-item{display:flex;align-items:center;gap:26px;padding-right:26px;height:100%;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;text-transform:uppercase;white-space:nowrap}
.rope-w{font-weight:800;font-size:19px;letter-spacing:.04em}
.rope-s{font-weight:600;font-size:11px;letter-spacing:.22em}
.rope-m{height:17px;width:auto;filter:invert(1)}
@keyframes ph-slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.rope-track{animation:none}}

/* photo placeholders */
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;border:1.5px dashed #77776F;background:#2A2A2A repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.04) 14px 15px);color:#C4C4C0;font-size:13px;line-height:1.4}
.ph b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#F5F5F3}
.ph-light{background:#E9E9E6 repeating-linear-gradient(135deg,rgba(22,22,22,0) 0 14px,rgba(22,22,22,.05) 14px 15px);border-color:#77776F;color:#3A3A39}
.ph-light b{color:#161616}
.todo{border:1.5px dashed #77776F;padding:2px 8px;font-size:13px}

/* numsurin */
.num{position:relative;overflow:hidden}
.ghost{position:absolute;top:18px;left:-8px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-style:italic;font-size:132px;line-height:1;text-transform:uppercase;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(245,245,243,.11);pointer-events:none}
.num-grid{position:relative;display:flex;flex-direction:column;gap:22px}
.num-head{display:flex;flex-direction:column;gap:14px}
.num-h{font-size:40px}
.num-photo{position:relative}
.num-pic{aspect-ratio:5/4;overflow:hidden;background:#0B0B0B;margin:0 -20px}
.num-pic img{width:100%;height:100%;object-fit:cover;object-position:center 10%}
.plate{position:relative;margin:-26px 0 0 14px;display:inline-block;background:#F5F5F3;color:#161616;padding:10px 26px 10px 18px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.plate .h{font-size:27px}
.plate .th{font-size:14px;color:#3A3A39;display:block;margin-top:2px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:11px 0;border-top:1px solid #3A3A3A;align-items:baseline}
.rows li:last-child{border-bottom:1px solid #3A3A3A}
.rows .k{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#8E8E8C}
.rows .v{font-size:15px;font-weight:500}
.num-cta{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.small{font-size:13px;color:#C4C4C0}
.light .small{color:#5A5A58}

/* about */
.about-grid{display:flex;flex-direction:column;gap:24px}
.about-copy{display:flex;flex-direction:column;gap:16px}
.about-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.about-photos figure{margin:0;position:relative;overflow:hidden;aspect-ratio:3/4}
.about-photos img{width:100%;height:100%;object-fit:cover}
.about-photos .wide{display:none}
.about-photos{padding-bottom:18px}
.about-photos figure:nth-child(2){transform:translateY(18px)}
.cap{position:absolute;left:0;bottom:0;background:#161616;color:#F5F5F3;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:6px 18px 6px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}

/* carousels on mobile */
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 12px;margin:0 -20px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller > *{scroll-snap-align:start;flex:0 0 auto}
.head{display:flex;flex-direction:column;gap:0;margin-bottom:22px}
.swipe{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:-12px 0 10px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#8E8E8C}

/* training options */
.opt{width:min(76cqw,300px);min-height:214px;display:flex;flex-direction:column;gap:10px;padding:20px;background:#222;border-top:3px solid #F5F5F3}
.opt .n{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.14em;color:#8E8E8C}
.opt .h{font-size:30px}
.opt p{font-size:14px;color:#C4C4C0;line-height:1.45}
.opt .foot{margin-top:auto;padding-top:12px;font-size:13px;font-weight:600;color:#F5F5F3}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 18px;padding:0 20px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;cursor:pointer;background:rgba(22,22,22,.08);color:#161616;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tab.on{background:#161616;color:#F5F5F3}
.sp-grid{display:flex;flex-direction:column;gap:56px}
.sp-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:22px}
.sp-switch button{min-height:54px;border:0;cursor:pointer;background:rgba(22,22,22,.08);color:#161616;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.sp-switch button.on{background:#161616;color:#F5F5F3}
.sp-col.off{display:none}
.panel{background:#fff;border:1px solid #D9D9D5;padding:18px}
.blk + .blk{margin-top:18px;padding-top:18px;border-top:1px solid #E3E3DF}
.blk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.blk-h b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase}
.blk-h span{font-size:14px;color:#5A5A58}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(132px,100%),1fr));gap:8px}
.times li{background:#F0F0ED;padding:10px 12px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.adv{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid #E3E3DF;font-size:13px;line-height:1.35}
.adv.hd{border-top:0;padding-top:0;font-size:12px;color:#5A5A58;font-weight:600}
.adv b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase}
.kv li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #E3E3DF;font-size:15px}
.kv li:first-child{border-top:0;padding-top:0}
.kv b{font-weight:600}
.kv span{color:#3A3A39;text-align:right;font-variant-numeric:tabular-nums}
.price{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;align-items:center;padding:11px 0;border-top:1px solid #E3E3DF}
.price:first-child{border-top:0;padding-top:0}
.price .pn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:16px}
.price .pd{grid-column:1;font-size:13px;color:#5A5A58}
.price .pp{grid-row:1 / span 2;grid-column:2;text-align:right;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:30px;line-height:1;white-space:nowrap}
.price .pp small{font-size:13px;font-weight:700;letter-spacing:.1em;margin-left:4px}
.tag{background:#F2C230;color:#161616;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px}
.note{margin-top:14px;font-size:13px;color:#5A5A58}
.rules{margin-top:14px;border:1px solid #D9D9D5;background:#fff}
.rules summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;cursor:pointer;font-weight:600;font-size:15px;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules summary::after{content:"+";font-size:22px;font-weight:400}
.rules[open] summary::after{content:"\2212"}
.rules ul{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:#3A3A39}
.rules li{padding-left:16px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:2px;background:#161616}

/* trainers */
.tr{width:min(74cqw,300px);margin:0;display:flex;flex-direction:column;gap:10px}
.tr > img{width:100%;height:auto}
.kid-pic{position:relative;aspect-ratio:954/1114;overflow:hidden;background:#0B0B0B}
.kid-pic img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.kid-t{position:absolute;left:0;right:0;bottom:0;padding:70px 16px 16px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(180deg,rgba(11,11,11,0) 0,rgba(11,11,11,.88) 62%)}
.kid-e{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#C4C4C0}
.kid-t .h{font-size:30px;color:#F5F5F3}
.kid-s{font-size:15px;font-weight:500;color:#F5F5F3}
.tr .ph,.tr .pic{aspect-ratio:4/5}
.tr .pic{overflow:hidden;background:#2A2A2A}
.tr .pic img{width:100%;height:100%;object-fit:cover;object-position:center top}
.tr .tg{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#C4C4C0;line-height:1.3}
.tr .h{font-size:32px}
.tr .rn{font-size:13px;color:#8E8E8C;margin-top:2px}
.tr ul{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#C4C4C0}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:visible;padding:0;margin:0}
.gal figure{margin:0;position:relative;overflow:hidden;height:132px;background:#2A2A2A}
.gal .big{grid-column:span 2;height:214px}
.gal .cap{font-size:12px}
.gal img{width:100%;height:100%;object-fit:cover}

/* reviews */
.rv{width:min(80cqw,320px);margin:0;display:flex;flex-direction:column;gap:14px;padding:22px 20px;background:#242424;border-top:3px solid #F5F5F3;color:#E4E4E0;font-size:15px;line-height:1.55}
.rv blockquote{margin:0}
.stars{color:#F2C230;font-size:17px;letter-spacing:3px}
.rv .who b{display:block;color:#F5F5F3;font-size:15px;font-weight:600}
.rv-more{margin-top:20px;font-size:15px}
.rv .q{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:54px;line-height:.6;color:#F5F5F3;height:24px}
.rv .who{margin-top:auto;font-size:13px;color:#8E8E8C}

/* booking */
.bk-grid{display:flex;flex-direction:column;gap:22px}
.bk-side{display:flex;flex-direction:column;gap:14px}
.bk-h{font-size:42px}
.bk-card{background:#F5F5F3;color:#161616;padding:18px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:18px}
.steps li{padding-top:8px;border-top:4px solid #D4D4D0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#77776F}
.steps li.on{border-color:#161616;color:#161616}
.q-h{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase;line-height:1;margin:0 0 12px}
.q-h.gap{margin-top:22px}
.ty{display:flex;flex-direction:column;gap:8px}
.ty button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;width:100%;min-height:62px;padding:10px 14px;border:1.5px solid #D4D4D0;background:#fff;color:#161616;cursor:pointer;font:inherit}
.ty button.on{background:#161616;border-color:#161616;color:#F5F5F3}
.ty .tn{font-weight:600;font-size:16px}
.ty .tm{grid-column:1;font-size:13px;opacity:.72}
.ty .tp{grid-row:1 / span 2;grid-column:2;text-align:right;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:22px;line-height:1.05;white-space:nowrap}
.ty .tp small{display:block;font-family:Inter,sans-serif;font-style:normal;font-weight:500;font-size:11px;opacity:.72;margin-top:3px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;width:62px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid #D4D4D0;background:#fff;color:#161616;cursor:pointer;font:inherit;font-size:12px}
.days button b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:26px;line-height:1}
.days button.on{background:#161616;border-color:#161616;color:#F5F5F3}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(104px,100%),1fr));gap:8px}
.slots button{min-height:46px;border:1.5px solid #D4D4D0;background:#fff;color:#161616;cursor:pointer;font:inherit;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.slots button.on{background:#161616;border-color:#161616;color:#F5F5F3}
.stepper{display:flex;align-items:center;gap:14px}

.bk-nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
.back{min-height:44px;padding:0 6px;border:0;background:none;color:#161616;font:inherit;font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}

/* location */
.loc-grid{display:flex;flex-direction:column;gap:18px}
.map{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:190px;padding:20px;text-decoration:none;text-align:center;color:#161616;border:1px solid #D4D4D0;background-color:#E4E4E0;background-image:linear-gradient(rgba(22,22,22,.07) 1px,rgba(22,22,22,0) 1px),linear-gradient(90deg,rgba(22,22,22,.07) 1px,rgba(22,22,22,0) 1px),linear-gradient(118deg,rgba(255,255,255,0) 44%,rgba(255,255,255,.85) 44%,rgba(255,255,255,.85) 51%,rgba(255,255,255,0) 51%);background-size:44px 44px,44px 44px,100% 100%}

.map-t b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;color:#161616}
.loc-cta{display:none}
.addr{font-size:17px;font-weight:500;line-height:1.5}
.ct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#D4D4D0;border:1px solid #D4D4D0}

/* footer */
.ftr{flex:1 0 auto;display:flex;flex-direction:column;padding:40px 20px 24px;background:#161616}
.ftr-logo{flex:1 0 auto;min-height:130px;display:flex;align-items:center;justify-content:center}
.ftr-logo img{width:190px;height:auto}
.ftr-legal{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8E8E8C;text-align:center}

/* mobile sticky booking bar */
.mbar{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(22,22,22,.95);backdrop-filter:blur(10px);border-top:1px solid #2A2A2A}

.mbar .ic{padding:0;width:52px}

.q-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.q-row .q-h{margin:0}
.cal-btn{flex:0 0 auto;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #161616;background:#fff;color:#161616;cursor:pointer}
.cal-btn.on{background:#161616;color:#F5F5F3}
.cal{border:1.5px solid #D4D4D0;background:#fff;padding:12px}
.cal-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-m{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase}
.cal-nav{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:#F0F0ED;color:#161616;cursor:pointer}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{text-align:center;font-size:11px;font-weight:600;color:#5A5A58;padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.cal-d{min-height:44px;border:0;background:#F0F0ED;color:#161616;font:inherit;font-size:15px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}

.cal-d.today{box-shadow:inset 0 0 0 1.5px #161616}

.cal-d[disabled]:not(.blank){background:transparent;color:#B4B4B0;cursor:not-allowed;text-decoration:line-through}
.picked{margin-top:10px;font-size:14px;font-weight:600}

/* booking v2 */
.bk-card{background:#fff;padding:18px 18px 10px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.bk-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.bk-count{font-size:13px;font-weight:600;color:#5A5A58}
.bk-back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 2px;border:0;background:none;color:#161616;font:600 14px Inter,sans-serif;cursor:pointer}
.bk-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:4px 0 20px}
.bk-bar i{height:4px;background:#E4E4E0;transition:background .3s ease}
.bk-bar.s1 i:nth-child(1),.bk-bar.s2 i:nth-child(-n+2),.bk-bar.s3 i{background:#161616}
.bk-title{font-size:34px;margin:0 0 16px}
.ty{gap:10px}
.ty button{grid-template-columns:20px minmax(0,1fr) auto;gap:2px 12px;min-height:68px;padding:12px 14px;border:1.5px solid #DADAD6;transition:border-color .15s ease,background .15s ease}
.ty button:hover{border-color:#8E8E8C}

.ty .rd{grid-column:1;grid-row:1 / span 2;width:20px;height:20px;border-radius:50%;border:1.5px solid #8E8E8C;display:flex;align-items:center;justify-content:center}
.ty .on .rd{border-color:#161616}
.ty .on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:#161616}
.ty .tn{grid-column:2}
.ty .tm{grid-column:2;color:#5A5A58;opacity:1}
.ty .tp{grid-column:3;font-size:20px}
.ty .tp small{color:#5A5A58;opacity:1}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-top:10px;font-size:13px;font-weight:600;color:#5A5A58;text-transform:uppercase;letter-spacing:.06em}
.lbl:first-of-type{margin-top:0}
.cal-btn{width:auto;height:44px;padding:0 12px;gap:6px;border:1.5px solid #DADAD6;font:600 13px Inter,sans-serif;text-transform:none;letter-spacing:0}
.cal-btn.on{border-color:#161616}
.days button{width:58px;min-height:70px;border-color:#DADAD6;transition:border-color .15s ease}

.days button span{color:#5A5A58}
.days button.on span{color:#C4C4C0}
.picked{margin-top:8px;font-size:13px;color:#5A5A58}
.empty{background:#F5F5F3;padding:14px;font-size:14px;color:#5A5A58}
.sg + .sg{margin-top:12px}
.sg-l{display:block;font-size:12px;color:#5A5A58;margin-bottom:6px}
.slots{grid-template-columns:repeat(3,minmax(0,1fr))}
.slots button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-color:#DADAD6;transition:border-color .15s ease}
.slots button:hover{border-color:#8E8E8C}
.slots button b{font-size:15px;font-weight:600}
.slots button small{font-size:11px;font-weight:500;color:#5A5A58}
.slots button.on small{color:#C4C4C0}
.ppl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid #E9E9E6}
.ppl-t{display:flex;flex-direction:column;gap:2px}
.ppl-l{font-size:13px;font-weight:600;color:#5A5A58;text-transform:uppercase;letter-spacing:.06em}
.ppl-s{font-size:13px;color:#5A5A58}
.stepper{gap:10px}
.stepper button{width:44px;height:44px;border-color:#DADAD6}
.stepper b{font-size:26px}
.fld{margin-bottom:14px}
.fld label{color:#3A3A39}
.fld input,.fld textarea{min-height:52px;border-color:#DADAD6}
.fld input:focus,.fld textarea:focus{outline:0;border-color:#161616;box-shadow:inset 0 0 0 1px #161616}
.note-d summary{display:inline-flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;text-decoration:underline;text-underline-offset:4px}
.note-d summary::-webkit-details-marker{display:none}
.note-d[open] summary{display:none}
.bk-foot{display:flex;flex-direction:column;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #E9E9E6}
.bk-sum{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font-size:13px;color:#5A5A58;line-height:1.4}
.bk-sum b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;font-size:24px;line-height:1;color:#161616;white-space:nowrap}
.bk-next{width:100%}
.bk-hint{font-size:12px;color:#5A5A58;text-align:center}
.done-p{margin-bottom:14px;font-size:15px;color:#3A3A39}
.root .sum{background:#F5F5F3;border:0;padding:4px 14px;margin-bottom:0}
.mbar{transition:transform .3s ease}
.in-book .mbar{transform:translateY(110%)}
.wa{margin-top:6px;padding-top:0;border-top:0;gap:0}
.line-link{width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;color:#5A5A58;font:500 14px Inter,sans-serif;cursor:pointer}
.line-link .u{color:#161616;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.wa-box{display:flex;flex-direction:column;gap:10px;padding:14px;margin-bottom:10px;background:#F5F5F3}
.wa-msg{border:0;font-size:14px}

/* schedule and prices v2 */
.card{background:#fff;padding:16px;box-shadow:0 10px 30px rgba(22,22,22,.08)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk button{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid #DADAD6;background:#fff;color:#161616;font:600 13px Inter,sans-serif;cursor:pointer;transition:border-color .15s ease}

.wk button.today i{background:#161616}

.wk button.on.today i{background:#F5F5F3}
.wk-t{margin:12px 0 2px;font-size:13px;font-weight:600;color:#5A5A58}
.tt li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:50px;padding:6px 0;border-top:1px solid #EDEDEA}
.tt li:first-child{border-top:0}
.tt-t{display:flex;flex-direction:column;line-height:1.25;font-variant-numeric:tabular-nums}
.tt-t b{font-size:16px;font-weight:600}
.tt-t small,.tt-n small{font-size:12px;color:#5A5A58}
.tt-n{display:flex;flex-direction:column;line-height:1.3;min-width:0}

.tt-a{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;white-space:nowrap;text-underline-offset:4px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid #DADAD6;margin-bottom:6px}
.seg button{min-height:44px;border:0;background:#fff;color:#161616;font:600 13px Inter,sans-serif;cursor:pointer}
.seg button.on{background:#161616;color:#F5F5F3}
.card .price{padding:12px 0;border-top-color:#EDEDEA}
.seg + .price{border-top:0}
.card .note{margin-top:6px}
.card-cta{width:100%;margin-top:14px}

/* motion */
@keyframes ph-rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes ph-zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes ph-drift{from{transform:translateX(0)}to{transform:translateX(-14%)}}
.hero-copy > *{animation:ph-rise .8s cubic-bezier(.2,.7,.2,1) both}
.hero-copy > :nth-child(2){animation-delay:.08s}
.hero-copy > :nth-child(3){animation-delay:.16s}
.hero-copy > :nth-child(4){animation-delay:.24s}
.hero-copy > :nth-child(5){animation-delay:.32s}
.hero-photo img{animation:ph-zoom 2.6s cubic-bezier(.2,.7,.2,1) both}
.ghost{animation:ph-drift 26s ease-in-out infinite alternate}
.anim [data-rv]{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.anim [data-rv].in{opacity:1;transform:none}
.btn{transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.opt,.rv{transition:transform .25s ease}
.opt:hover,.rv:hover{transform:translateY(-4px)}
.gal img,.tr .pic img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.gal figure:hover img{transform:scale(1.05)}
.tr{transition:transform .25s ease}
.tr:hover{transform:translateY(-4px)}
@media (prefers-reduced-motion:reduce){.hero-copy > *,.hero-photo img,.ghost{animation:none}.anim [data-rv]{opacity:1;transform:none;transition:none}}

.is-th .bk-title{font-size:26px}
.is-th .lbl,.is-th .ppl-l{text-transform:none;letter-spacing:0}

.bk-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:64px;align-items:start}
.bk-h{font-size:92px}
.bk-card{padding:28px 32px 16px}
.bk-title{font-size:44px}
.days{margin:0;padding:0 0 4px;flex-wrap:wrap}
.ty button{min-height:76px;padding:14px 18px}

.loc-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:56px;align-items:stretch}
.map{min-height:320px}
.ftr{padding:56px 40px 28px}
.ftr-logo{min-height:220px}
.ftr-logo img{width:280px}
.ftr-legal{flex-direction:row;justify-content:space-between;text-align:left;max-width:1160px;width:100%;margin:0 auto}
.is-th .h1{font-size:min(5.6cqw,84px)}
.is-th .h2{font-size:50px}
.is-th .num-h{font-size:48px}
.is-th .bk-h{font-size:58px}
.is-th .opt .h{font-size:28px}
.is-th .facts b{font-size:24px}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div class="root {{rootCls}}" lang="{{lang}}" style="--red: {{accent}}">

<header class="hdr">
<a class="brand" href="#top" aria-label="Phetsiam Muay Thai Gym, back to top"><img class="mk" src="assets/logo-mark.png" alt=""><img class="wm" src="assets/logo-wordmark.png" alt="Phetsiam Muay Thai Gym"></a>
<nav class="nav" aria-label="Sections">
<a href="#numsurin">{{t.k0}}</a>
<a href="#training">{{t.k1}}</a>
<a href="#schedule">{{t.k2}}</a>
<a href="#trainers">{{t.k3}}</a>
<a href="#gym">{{t.k4}}</a>
<a href="#location">{{t.k5}}</a>
</nav>
<div class="hdr-r"><div class="lang" role="group" aria-label="Language"><button type="button" class="{{enCls}}" aria-pressed="{{isEn}}" onClick="{{setEn}}">EN</button><button type="button" class="{{thCls}}" aria-pressed="{{isTh}}" onClick="{{setTh}}">TH</button></div>
<a class="btn btn-red hdr-cta" href="#book">{{t.k6}}</a></div>
</header>

<section class="hero" id="top">
<div class="hero-photo"><img src="assets/hero-team-tall.jpg" alt="Fighters, trainers and students of Phetsiam standing together in front of the ring in the steel hall"></div>
<div class="hero-copy">
<a class="pill" href="#numsurin"><span>{{t.k87}}</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<h1 class="h h1">{{t.k8}}<br>{{t.k9}}</h1>
<p class="lede">{{t.k10}}</p>
<div class="cta-row">
<a class="btn btn-red" href="#book">{{t.k6}}</a>
<a class="btn btn-ghost" href="#book" onClick="{{openWa}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c-5 0-9 3.2-9 7.2 0 3.6 3.2 6.6 7.5 7.1.4.1.6.4.5.8l-.3 1.6c-.1.5.4.8.8.6 2.9-1.6 9.5-5.7 9.5-10.1 0-4-4-7.2-9-7.2z"/></svg>{{t.k7}}</a>
</div>
<ul class="facts">
<li><b>550 THB</b><span>{{t.k11}}</span></li>
<li><b>07:00</b><span>{{t.k12}}</span></li>
<li><b>{{t.k13}}</b><span>{{t.k14}}</span></li>
</ul>
</div>
</section>

<div class="ropes" aria-hidden="true">
<div class="rope"><div class="rope-track"><sc-for list="{{rope}}" as="r" hint-placeholder-count="8"><span class="rope-item"><span class="rope-w">Phetsiam</span><span class="rope-s">Muay Thai Gym</span><img class="rope-m" src="assets/logo-mark.png" alt=""></span></sc-for></div></div>
<div class="rope rope-b"><div class="rope-track"><sc-for list="{{rope}}" as="r" hint-placeholder-count="8"><span class="rope-item"><span class="rope-w">Real Muay Thai for everyone</span><img class="rope-m" src="assets/logo-mark.png" alt=""><span class="rope-s">Sathu Pradit 58, Bangkok</span></span></sc-for></div></div>
</div>

<section class="sec dim num" id="numsurin">
<div class="ghost" aria-hidden="true">{{t.k0}}</div>
<div class="wrap num-grid">
<div class="num-head" data-rv>
<p class="eyebrow">{{t.k15}}</p>
<h2 class="h num-h">{{t.k16}}</h2>
</div>
<div class="num-photo" data-rv>
<div class="num-pic"><img src="assets/tr-numsurin.jpg" alt="Numsurin Chor Ketwina raising his fist in the ring"></div>
<div class="plate"><span class="h">Numsurin Chor Ketwina</span></div>
</div>
<ul class="rows num-body" data-rv>
<li><span class="k">{{t.k17}}</span><span class="v">{{t.k20}}</span></li>
<li><span class="k">ONE Championship</span><span class="v">{{t.k21}}</span></li>
<li><span class="k">{{t.k18}}</span><span class="v">{{t.k22}}</span></li>
<li class="m-hide-li"><span class="k">{{t.k19}}</span><span class="v">{{t.k23}}</span></li>
</ul>
<div class="num-cta" data-rv>
<a class="btn btn-ghost" href="#book" onClick="{{pickNumsurin}}">{{t.k24}}</a>
<p class="small">{{t.k25}}</p>
</div>
</div>
</section>

<section class="sec light" id="about">
<div class="wrap about-grid">
<div class="about-copy" data-rv>
<div>
<p class="eyebrow">{{t.k26}}</p>
<h2 class="h h2">{{t.k27}}<br>{{t.k28}}</h2>
</div>
<p class="lede">{{t.k29}}</p>
<p class="lede m-hide">{{t.k30}}</p>
</div>
<div class="about-photos" data-rv>
<figure><img src="assets/trainer-smile.jpg" alt="A Phetsiam trainer smiling, wearing a belly pad in front of the pad wall"></figure>
<figure><img src="assets/student-smile.jpg" alt="A student smiling during training in blue gloves"></figure>
<figure class="wide"><img src="assets/students-group.jpg" alt="A mixed group of students and trainers posing with gloves up after class"></figure>
</div>
</div>
</section>

<section class="sec" id="training">
<div class="wrap">
<div class="head" data-rv>
<p class="eyebrow">{{t.k31}}</p>
<h2 class="h h2">{{t.k32}}</h2>
</div>
<p class="swipe" aria-hidden="true"><span>{{t.k86}}</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></p>
<div class="scroller opts" data-rv>
<div class="opt"><span class="n">01 / Zone B</span><h3 class="h">{{t.k33}}</h3><p>{{t.k43}}</p><span class="foot">{{t.k49}}</span></div>
<div class="opt"><span class="n">02 / Zone A</span><h3 class="h">{{t.k34}}</h3><p>{{t.k44}}</p><span class="foot">{{t.k50}}</span></div>
<div class="opt"><span class="n">{{t.k39}}</span><h3 class="h">{{t.k35}}</h3><p>{{t.k45}}</p><span class="foot">{{t.k51}}</span></div>
<div class="opt"><span class="n">{{t.k40}}</span><h3 class="h">{{t.k36}}</h3><p>{{t.k46}}</p><span class="foot">{{t.k52}}</span></div>
<div class="opt"><span class="n">{{t.k41}}</span><h3 class="h">{{t.k37}}</h3><p>{{t.k47}}</p><span class="foot">{{t.k53}}</span></div>
<div class="opt"><span class="n">{{t.k42}}</span><h3 class="h">{{t.k38}}</h3><p>{{t.k48}}</p><span class="foot">{{t.k54}}</span></div>
</div>
</div>
</section>

<section class="sec light" id="schedule">
<div class="wrap">
<div class="sp-switch" role="group" aria-label="Schedule or prices"><button type="button" class="{{spSchedCls}}" aria-pressed="{{spSched}}" onClick="{{showSched}}">{{t.k92}}</button><button type="button" class="{{spPriceCls}}" aria-pressed="{{spPrice}}" onClick="{{showPrice}}">{{t.k93}}</button></div>
<div class="sp-grid">
<div class="sp-col {{schedOff}}">
<div class="head" data-rv>
<p class="eyebrow">{{t.k55}}</p>
<h2 class="h h2">{{t.k56}}</h2>
</div>
<div class="card" data-rv>
<div class="wk" role="group" aria-label="Day of the week">
<sc-for list="{{week}}" as="wd" hint-placeholder-count="7"><button type="button" class="{{wd.cls}}" aria-pressed="{{wd.on}}" onClick="{{wd.pick}}"><span>{{wd.label}}</span><i></i></button></sc-for>
</div>
<p class="wk-t">{{dayTitle}}</p>
<ul class="tt">
<sc-for list="{{dayRows}}" as="c" hint-placeholder-count="8"><li><span class="tt-t"><b>{{c.start}}</b><small>{{c.end}}</small></span><span class="tt-n"><b>{{c.name}}</b><small>{{c.sub}}</small></span><span class="lv {{c.lv}}">{{c.tag}}</span></li></sc-for>
</ul>
<div class="tt-x"><span class="tt-n"><b>{{privTitle}}</b><small>{{privSub}}</small></span><a class="tt-a" href="#book">{{t.k6}}</a></div>
</div>
</div>

<div id="prices" class="sp-col {{priceOff}}">
<div class="head" data-rv>
<p class="eyebrow">{{t.k58}}</p>
<h2 class="h h2">{{t.k59}}</h2>
</div>
<div class="card" data-rv>
<div class="seg" role="group" aria-label="Prices">
<sc-for list="{{priceTabs}}" as="pt" hint-placeholder-count="3"><button type="button" class="{{pt.cls}}" aria-pressed="{{pt.on}}" onClick="{{pt.pick}}">{{pt.label}}</button></sc-for>
</div>
<sc-for list="{{priceRows}}" as="p" hint-placeholder-count="5"><div class="price"><span class="pn">{{p.n}}<sc-if value="{{p.tag}}" hint-placeholder-val="{{ false }}"><span class="tag">{{p.tag}}</span></sc-if></span><span class="pd">{{p.d}}</span><span class="pp">{{p.p}}<small>THB</small></span></div></sc-for>
<p class="note">{{priceNote}}</p>
<a class="btn btn-dark card-cta" href="#book">{{t.k6}}</a>
</div>
<details class="rules">
<summary>{{t.k60}}</summary>
<ul>
<li>{{t.k61}}</li>
<li>{{t.k62}}</li>
<li>{{t.k63}}</li>
<li>{{t.k64}}</li>
<li>{{t.k65}}</li>
<li>{{t.k66}}</li>
</ul>
</details>
</div>
</div>
</div>
</section>

<section class="sec" id="trainers">
<div class="wrap">
<div class="head" data-rv>
<p class="eyebrow">{{t.k67}}</p>
<h2 class="h h2">{{t.k68}}</h2>
</div>
<p class="swipe" aria-hidden="true"><span>{{t.k86}}</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></p>
<div class="scroller trs" data-rv>
<figure class="tr"><img src="assets/poster-kai.jpg" alt="Kru Kai, Por.Prasit Kor Kai Lek (Worrawit Sathonrat): 210 fights, 75% win rate, style Muay Khao"><figcaption class="tg">{{t.k69}}</figcaption></figure>
<figure class="tr"><img src="assets/poster-lead.jpg" alt="Kru Lead, Leadchai (Lerdchai Chaiyawed): 124 fights, 70% win rate, style Muay Mad"><figcaption class="tg">{{t.k70}}</figcaption></figure>
<figure class="tr"><img src="assets/poster-mew.jpg" alt="Kru Mew, Kairo (Surasak Chumkeaw): 320 fights, 70% win rate, style Muay Femur"><figcaption class="tg">{{t.k71}}</figcaption></figure>
<figure class="tr"><img src="assets/poster-nut.jpg" alt="Kru Nut, Sor.Sangtong Jaiphet (Nuttachai Sangadang): 100 fights, 80% win rate, style Muay Femur"><figcaption class="tg">{{t.k72}}</figcaption></figure>
<figure class="tr"><img src="assets/poster-owen.jpg" alt="Kru Owen, K.Thasai Mareo (Anurak Tuwtong): 180 fights, 80% win rate, style Muay Femur"><figcaption class="tg">{{t.k73}}</figcaption></figure>
<figure class="tr"><img src="assets/poster-sami.jpg" alt="Kru Sami, Sami Jansens: bachelor degree in physical education, kickboxing and Muay Thai background, 75% win rate, strength and conditioning specialist, athletic performance and fitness coach"><figcaption class="tg">{{t.k74}}</figcaption></figure>
<figure class="tr"><img src="assets/poster-tom.jpg" alt="Kru Tom, Haitongkam Narindech (Denchai Somarpa): 190 fights, 75% win rate, style Muay Femur"><figcaption class="tg">{{t.k75}}</figcaption></figure>
<figure class="tr kid"><div class="kid-pic"><img src="assets/little-coach.jpg" alt="A small child in a gym shirt watching training through the ring ropes with a serious face"><div class="kid-t"><span class="kid-e">{{t.k88}}</span><b class="h">{{t.k89}}</b><span class="kid-s">{{t.k90}}</span></div></div><figcaption class="tg">{{t.k91}}</figcaption></figure>
</div>
</div>
</section>

<section class="sec light" id="gym">
<div class="wrap">
<div class="head" data-rv>
<p class="eyebrow">{{t.k4}}</p>
<h2 class="h h2">{{t.k76}}</h2>
</div>
<div class="scroller gal" data-rv>
<figure class="big"><img src="assets/team-ring.jpg" alt="The Phetsiam team posing in front of the ring with the Phetsiam banner behind them"><figcaption class="cap">{{t.k77}}</figcaption></figure>
<figure><img src="assets/pads-ropes.jpg" alt="A trainer holding pads talks to a fighter at the ropes between rounds"><figcaption class="cap">{{t.k78}}</figcaption></figure>
<figure><img src="assets/ropes-rest.jpg" alt="Fighters resting on the white Phetsiam ropes"><figcaption class="cap">{{t.k79}}</figcaption></figure>
<figure><img src="assets/sparring-posters.jpg" alt="Two people sparring in front of the trainer posters"><figcaption class="cap">{{t.k80}}</figcaption></figure>
<figure><img src="assets/fightnight.jpg" alt="Adam Johnson with medal, trophy and certificate after his fight, with his Phetsiam corner team"><figcaption class="cap">{{t.k81}}</figcaption></figure>
</div>
<p class="note m-hide">{{t.k82}}</p>
</div>
</section>

<section class="sec dim" id="reviews">
<div class="wrap">
<div class="head" data-rv>
<p class="eyebrow">{{t.k83}}</p>
<h2 class="h h2">{{t.k94}}</h2>
</div>
<p class="swipe" aria-hidden="true"><span>{{t.k86}}</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></p>
<div class="scroller rvs" data-rv>
<figure class="rv"><span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span><blockquote>"I took a private session at the gym and it was brilliant. I have trained in 5 or 6 gyms across Thailand and the quality of this session was exceptional."</blockquote><figcaption class="who"><b>Oliver Marrow</b><span>Google review</span></figcaption></figure>
<figure class="rv"><span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span><blockquote>"All the coaches are great at teaching, and the gym has a spacious training area. [...] I come here regularly and will definitely keep coming back!"</blockquote><figcaption class="who"><b>panisara buddee</b><span>Google review</span></figcaption></figure>
<figure class="rv"><span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span><blockquote>"The atmosphere is super welcoming and friendly. The whole team is absolutely fantastic and their teaching is excellent."</blockquote><figcaption class="who"><b>Tatjana D</b><span>Google review</span></figcaption></figure>
</div>
<p class="rv-more"><a class="textlink" href="https://maps.app.goo.gl/cM1MFk8636wSnCyW9" target="_blank" rel="noopener">{{t.k84}}</a></p>
</div>
</section>

<section class="sec" id="book">
<div class="wrap bk-grid">
<div class="bk-side" data-rv>
<p class="eyebrow">{{t.k6}}</p>
<h2 class="h bk-h">{{t.k95}}</h2>
<p class="lede m-hide">{{t.k96}}</p>
</div>

<div class="bk-card" data-rv>
<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<div class="bk-top"><span class="bk-count">{{stepCount}}</span><sc-if value="{{canBack}}" hint-placeholder-val="{{ false }}"><button type="button" class="bk-back" onClick="{{back}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>{{t.k98}}</span></button></sc-if></div>
<div class="bk-bar {{barCls}}" aria-hidden="true"><i></i><i></i><i></i></div>
<h3 class="h bk-title">{{stepTitle}}</h3>
</sc-if>

<sc-if value="{{step1}}" hint-placeholder-val="{{ true }}">
<div class="ty">
<sc-for list="{{types}}" as="ty" hint-placeholder-count="4"><button type="button" class="{{ty.cls}}" aria-pressed="{{ty.on}}" onClick="{{ty.pick}}"><span class="rd"></span><span class="tn">{{ty.name}}</span><span class="tm">{{ty.meta}}</span><span class="tp">{{ty.price}}<small>{{ty.unit}}</small></span></button></sc-for>
</div>
</sc-if>

<sc-if value="{{step2}}" hint-placeholder-val="{{ false }}">
<div class="lbl"><span>{{t.k57}}</span><button type="button" class="cal-btn {{calBtnCls}}" aria-expanded="{{calOpen}}" aria-label="{{calBtnLabel}}" onClick="{{toggleCal}}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>{{t.k115}}</span></button></div>
<sc-if value="{{calClosed}}" hint-placeholder-val="{{ true }}">
<div class="days">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button type="button" class="{{d.cls}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}"><span>{{d.dow}}</span><b>{{d.day}}</b><span>{{d.mon}}</span></button></sc-for>
</div>
</sc-if>
<sc-if value="{{calOpen}}" hint-placeholder-val="{{ false }}">
<div class="cal">
<div class="cal-hd"><button type="button" class="cal-nav" aria-label="{{calPrevLabel}}" disabled="{{calPrevDis}}" onClick="{{calPrev}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><b class="cal-m">{{calTitle}}</b><button type="button" class="cal-nav" aria-label="{{calNextLabel}}" disabled="{{calNextDis}}" onClick="{{calNext}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
<div class="cal-grid">
<sc-for list="{{calDow}}" as="w" hint-placeholder-count="7"><span class="cal-w">{{w}}</span></sc-for>
<sc-for list="{{calCells}}" as="c" hint-placeholder-count="35"><button type="button" class="cal-d {{c.cls}}" disabled="{{c.dis}}" aria-pressed="{{c.on}}" aria-label="{{c.label}}" onClick="{{c.pick}}">{{c.n}}</button></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{hasDay}}" hint-placeholder-val="{{ false }}"><p class="picked">{{pickedText}}</p></sc-if>
<div class="lbl"><span>{{t.k110}}</span></div>
<sc-if value="{{noDay}}" hint-placeholder-val="{{ false }}"><p class="empty">{{t.k97}}</p></sc-if>
<sc-if value="{{hasAm}}" hint-placeholder-val="{{ false }}"><div class="sg"><span class="sg-l">{{t.k112}}</span><div class="slots"><sc-for list="{{slotsAm}}" as="sl" hint-placeholder-count="3"><button type="button" class="{{sl.cls}}" aria-pressed="{{sl.on}}" onClick="{{sl.pick}}"><b>{{sl.start}}</b><small>{{sl.dur}}</small></button></sc-for></div></div></sc-if>
<sc-if value="{{hasPm}}" hint-placeholder-val="{{ false }}"><div class="sg"><span class="sg-l">{{t.k113}}</span><div class="slots"><sc-for list="{{slotsPm}}" as="sl" hint-placeholder-count="3"><button type="button" class="{{sl.cls}}" aria-pressed="{{sl.on}}" onClick="{{sl.pick}}"><b>{{sl.start}}</b><small>{{sl.dur}}</small></button></sc-for></div></div></sc-if>
<sc-if value="{{hasEv}}" hint-placeholder-val="{{ false }}"><div class="sg"><span class="sg-l">{{t.k114}}</span><div class="slots"><sc-for list="{{slotsEv}}" as="sl" hint-placeholder-count="3"><button type="button" class="{{sl.cls}}" aria-pressed="{{sl.on}}" onClick="{{sl.pick}}"><b>{{sl.start}}</b><small>{{sl.dur}}</small></button></sc-for></div></div></sc-if>
<div class="ppl"><div class="ppl-t"><span class="ppl-l">{{t.k111}}</span><span class="ppl-s">{{pplSub}}</span></div><sc-if value="{{canCount}}" hint-placeholder-val="{{ true }}"><div class="stepper"><button type="button" aria-label="One person fewer" onClick="{{less}}">-</button><b>{{people}}</b><button type="button" aria-label="One person more" onClick="{{more}}">+</button></div></sc-if></div>
</sc-if>

<sc-if value="{{step3}}" hint-placeholder-val="{{ false }}">
<div class="fld"><label for="bk-name">{{t.k99}}</label><input id="bk-name" type="text" autocomplete="name" value="{{name}}" onChange="{{setName}}"></div>
<div class="fld"><label for="bk-phone">{{t.k100}}</label><input id="bk-phone" type="tel" autocomplete="tel" value="{{phone}}" onChange="{{setPhone}}"></div>
<div class="fld"><label for="bk-mail">{{t.k101}}</label><input id="bk-mail" type="email" autocomplete="email" value="{{email}}" onChange="{{setEmail}}"></div>
<details class="note-d"><summary>{{t.k117}}</summary><div class="fld"><label for="bk-note">{{t.k102}}</label><textarea id="bk-note" value="{{note}}" onChange="{{setNote}}"></textarea></div></details>
</sc-if>

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<div class="bk-foot">
<div class="bk-sum"><span>{{footLine}}</span><b>{{total}}</b></div>
<button type="button" class="btn btn-red bk-next {{nextCls}}" onClick="{{next}}">{{nextLabel}}</button>
<sc-if value="{{hasHint}}" hint-placeholder-val="{{ false }}"><p class="bk-hint">{{hint}}</p></sc-if>
<sc-if value="{{step3}}" hint-placeholder-val="{{ false }}"><p class="bk-hint">{{t.k103}}</p></sc-if>
</div>
</sc-if>

<sc-if value="{{step4}}" hint-placeholder-val="{{ false }}">
<div class="done-mark"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<h3 class="h bk-title">{{doneTitle}}</h3>
<p class="done-p">{{t.k104}}</p>
<ul class="sum">
<sc-for list="{{summaryFull}}" as="r" hint-placeholder-count="6"><li><span>{{r.k}}</span><b>{{r.v}}</b></li></sc-for>

calNext: function () { set({ calMonth: Math.min(MAXM, cm + 1) }); },
hasDay: !!selDay, pickedText: selDay ? tr('Selected: ', 'วันที่เลือก: ') + selDay.label : '',
slotNote: isGroup ? tr('Group class times from the gym schedule.', 'เวลาคลาสกลุ่มตามตารางของยิม') : tr('Private sessions are by appointment, at least 24 hours ahead and subject to coach availability.', 'เทรนส่วนตัวต้องนัดหมายล่วงหน้าอย่างน้อย 24 ชั่วโมง ขึ้นอยู่กับตารางครูผู้สอน'),
canCount: isGroup, fixedCount: !isGroup, people: people,
peopleText: type.id === 'duo' ? tr('2 people (duo private)', '2 คน (เทรนส่วนตัวแบบคู่)') : tr('1 person. Training with a partner? Choose duo private.', '1 คน มาฝึกเป็นคู่? เลือกเทรนส่วนตัวแบบคู่'),
priceLine: tr(total + ' in total', 'รวม ' + total),
less: function () { set({ people: Math.max(1, s.people - 1) }); },
more: function () { set({ people: Math.min(8, s.people + 1) }); },
next: next,
back: function () { set({ step: Math.max(1, s.step - 1) }); },
reset: function () { set({ step: 1, date: null, time: null, people: 1, waOpen: false, calOpen: false, calMonth: 0 }); },
next2Cls: ok2 ? '' : 'btn-off', next3Cls: ok3 ? '' : 'btn-off',
name: s.name, phone: s.phone, email: s.email, note: s.note,
setName: function (e) { set({ name: e.target.value }); },
setPhone: function (e) { set({ phone: e.target.value }); },
setEmail: function (e) { set({ email: e.target.value }); },
setNote: function (e) { set({ note: e.target.value }); },
doneTitle: L ? ('แล้วเจอกันที่ยิม' + (firstName ? ' คุณ' + firstName : '')) : ('See you at the gym' + (firstName ? ', ' + firstName : '') + '.'),
summary: summary, summaryFull: summaryFull,
waOpen: s.waOpen, waMsg: waMsg, lineUrl: 'https://line.me/R/oaMessage/%40phetsiam/?' + encodeURIComponent(waMsg),
toggleWa: function () { set({ waOpen: !s.waOpen }); },
openWa: function () { set({ waOpen: true }); },
pickNumsurin: function () { set({ type: 'numsurin', step: 1, time: null }); }
};
}
